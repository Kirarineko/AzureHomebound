<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>青空归处：心火长明</title>
<meta name="description" content="《心火长明》在线阅读">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============ 主题变量 ============ */
:root{
  --accent:#e05d4e;
  --radius:12px;
}
html[data-theme="light"]{
  --bg:#f7f2e8; --text:#3b3733; --muted:#9a9187;
  --bar-bg:rgba(255,253,248,.96); --bar-text:#4a453f; --border:#e6ded0;
  --panel-bg:#fffdf8; --hover:rgba(0,0,0,.05);
}
html[data-theme="eye"]{
  --bg:#d3e4cf; --text:#33402f; --muted:#7c8a76;
  --bar-bg:rgba(233,243,230,.96); --bar-text:#3c4a38; --border:#c2d4bd;
  --panel-bg:#eaf3e6; --hover:rgba(0,0,0,.05);
}
html[data-theme="dark"]{
  --bg:#161616; --text:#9c9c9c; --muted:#5c5c5c;
  --bar-bg:rgba(31,31,31,.96); --bar-text:#b5b5b5; --border:#2c2c2c;
  --panel-bg:#1f1f1f; --hover:rgba(255,255,255,.07);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--text);
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  transition:background .3s,color .3s;
  user-select:none;-webkit-user-select:none;
}

/* ============ 阅读区 ============ */
#stage{position:fixed;inset:0}

/* 翻页模式：上下两层真实页面 */
#page-area{
  position:absolute;inset:0;
  padding:calc(18px + env(safe-area-inset-top)) 20px calc(46px + env(safe-area-inset-bottom));
  overflow:hidden;
}
.page{
  position:absolute;
  top:calc(18px + env(safe-area-inset-top));
  bottom:calc(46px + env(safe-area-inset-bottom));
  left:20px;right:20px;
  overflow:hidden;
  background:var(--bg);
  transition:background .3s;
}
#page-under{z-index:1}
#page-over{z-index:2}
/* 垫在底下的页面：缩小 + 模糊 + 变暗 */
.page.zoom{
  transform:scale(.94);
  filter:blur(4px);
  opacity:.7;
}
/* 正在滑走的页面：投影增强层次 */
.page.sliding-next{box-shadow:-14px 0 30px rgba(0,0,0,.22)}
.page.sliding-prev{box-shadow:14px 0 30px rgba(0,0,0,.22)}

/* 滚动模式 */
#scroll-area{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
#scroll-content{max-width:680px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 22px calc(60vh)}

body.mode-scroll #page-area{display:none}
body.mode-scroll #scroll-area{display:block}

/* 正文排版（两种模式共用） */
.content{font-size:18px;line-height:1.9}
.content h1{font-size:1.28em;font-weight:700;margin:0 0 1.1em;line-height:1.5}
.content h2{font-size:1.05em;font-weight:600;margin:1.2em 0 .8em;color:var(--muted)}
.content p{margin:0 0 .7em;text-indent:2em;text-align:justify;word-break:break-word}

.font-sans .content, .content.font-sans{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
.font-serif .content, .content.font-serif{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif}

/* 分页测量容器（不可见） */
#measurer{position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none}

/* 页脚信息（翻页模式） */
#page-foot{
  position:absolute;left:20px;right:20px;bottom:calc(12px + env(safe-area-inset-bottom));
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--muted);pointer-events:none;z-index:3;
}
body.mode-scroll #page-foot{display:none}

/* ============ 点击层 ============ */
#tap-layer{position:absolute;inset:0;display:flex;z-index:5}
#tap-layer .zone{flex:1}
#tap-layer .zone.mid{flex:1.4}
body.mode-scroll #tap-layer .zone.side{display:none}
body.mode-scroll #tap-layer .zone{flex:1}

/* ============ 顶栏 / 底栏 ============ */
.bar{
  position:absolute;left:0;right:0;z-index:20;
  background:var(--bar-bg);color:var(--bar-text);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:transform .25s ease,background .3s;
}
#topbar{
  top:0;display:flex;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  border-bottom:1px solid var(--border);
}
#topbar.hidden{transform:translateY(-110%)}
#topbar .back{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;cursor:pointer;font-size:18px}
#topbar .back:hover{background:var(--hover)}
#topbar .book{font-weight:700;font-size:15px;white-space:nowrap}
#topbar .chap{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#bottombar{
  bottom:0;display:flex;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);
}
#bottombar.hidden{transform:translateY(110%)}
#bottombar button{
  flex:1;background:none;border:none;color:var(--bar-text);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:12px;padding:6px 0;cursor:pointer;border-radius:8px;
  font-family:inherit;
}
#bottombar button:hover{background:var(--hover)}
#bottombar button .ic{font-size:19px;line-height:1}
#bottombar button.on{color:var(--accent)}

/* ============ 目录抽屉 ============ */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
#mask.show{opacity:1;pointer-events:auto}
#drawer{
  position:fixed;top:0;bottom:0;left:0;width:min(300px,82vw);z-index:31;
  background:var(--panel-bg);transform:translateX(-105%);
  transition:transform .28s ease,background .3s;
  display:flex;flex-direction:column;
}
#drawer.show{transform:translateX(0)}
#drawer .head{padding:calc(16px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--border)}
#drawer .head .t{font-weight:700;font-size:17px}
#drawer .head .s{font-size:12px;color:var(--muted);margin-top:4px}
#drawer .list{flex:1;overflow-y:auto;padding:6px 0}
#drawer .item{
  padding:12px 18px;font-size:14.5px;cursor:pointer;color:var(--bar-text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#drawer .item:hover{background:var(--hover)}
#drawer .item.cur{color:var(--accent);font-weight:600}

/* ============ 设置面板 ============ */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:31;
  background:var(--panel-bg);border-radius:var(--radius) var(--radius) 0 0;
  padding:18px 20px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .28s ease,background .3s;
  max-height:76vh;overflow-y:auto;
}
.sheet.show{transform:translateY(0)}
.sheet .row{margin-bottom:18px}
.sheet .row:last-child{margin-bottom:0}
.sheet .label{font-size:12.5px;color:var(--muted);margin-bottom:9px}
.sheet .opts{display:flex;gap:10px}
.sheet .opt{
  flex:1;padding:9px 0;text-align:center;font-size:14px;cursor:pointer;
  border:1px solid var(--border);border-radius:8px;color:var(--bar-text);
  background:none;transition:all .15s;font-family:inherit;
}
.sheet .opt.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.sheet .opt.font-sans-demo{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
.sheet .opt.font-serif-demo{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
.sheet .stepper{display:flex;align-items:center;gap:14px}
.sheet .stepper button{
  width:44px;height:36px;border:1px solid var(--border);border-radius:8px;
  background:none;color:var(--bar-text);font-size:16px;cursor:pointer;font-family:inherit;
}
.sheet .stepper .val{flex:1;text-align:center;font-size:15px}
.sheet .swatch{width:40px;height:40px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex:none}
.sheet .swatch.on{border-color:var(--accent)}
.sw-light{background:#f7f2e8}.sw-eye{background:#d3e4cf}.sw-dark{background:#2a2a2a}

/* 目录内搜索 */
#drawer .search{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--hover);border-radius:8px;padding:7px 10px}
#search-input{flex:1;min-width:0;border:none;background:none;outline:none;color:var(--bar-text);font-size:14px;font-family:inherit;user-select:text;-webkit-user-select:text}
#search-input::placeholder{color:var(--muted)}
#search-clear{border:none;background:none;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;padding:0 2px;display:none}
#search-clear.show{display:block}
.sr-head{padding:12px 18px 6px;font-size:12px;color:var(--muted)}
.sr-item{padding:10px 18px;cursor:pointer}
.sr-item:hover{background:var(--hover)}
.sr-item .c{font-size:12.5px;color:var(--accent);margin-bottom:3px}
.sr-item .s2{font-size:13.5px;color:var(--bar-text);line-height:1.65;word-break:break-all}
.content mark, .sr-item mark{background:#f0c33c;color:inherit;border-radius:2px;padding:0 1px}
html[data-theme="dark"] .content mark, html[data-theme="dark"] .sr-item mark{background:#8a6d1a}

/* ============ 听书 ============ */
.sheet .tin{
  width:100%;padding:9px 12px;font-size:14px;font-family:inherit;
  border:1px solid var(--border);border-radius:8px;background:none;color:var(--bar-text);
  outline:none;user-select:text;-webkit-user-select:text;
}
.sheet .tin:focus{border-color:var(--accent)}
.sheet .opts .tin{flex:1;min-width:0}
.tts-cur{background:rgba(224,93,78,.13);border-radius:6px}
html[data-theme="dark"] .tts-cur{background:rgba(224,93,78,.24)}
#tts-bar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom));z-index:25;
  display:none;align-items:center;gap:4px;
  background:var(--bar-bg);color:var(--bar-text);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid var(--border);border-radius:28px;
  padding:6px 10px;box-shadow:0 4px 18px rgba(0,0,0,.18);
  max-width:calc(100vw - 24px);
}
#tts-bar.show{display:flex}
#tts-bar button{
  border:none;background:none;color:var(--bar-text);cursor:pointer;
  width:36px;height:36px;border-radius:50%;font-size:15px;font-family:inherit;
  display:grid;place-items:center;flex:none;
}
#tts-bar button:hover{background:var(--hover)}
#tts-bar #tts-speedbtn{width:auto;padding:0 10px;border-radius:16px;font-size:12.5px}
#tts-status{font-size:12px;color:var(--muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============ 提示 ============ */
#toast{
  position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:50;
  background:rgba(0,0,0,.72);color:#fff;font-size:13.5px;
  padding:9px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .25s;
  white-space:nowrap;
}
#toast.show{opacity:1}
#loading{
  position:fixed;inset:0;display:grid;place-items:center;z-index:40;
  color:var(--muted);font-size:14px;pointer-events:none;
}
</style>
</head>
<body class="font-serif mode-paged">

<div id="stage">
  <!-- 翻页模式：双层页面 -->
  <div id="page-area">
    <div id="page-under" class="page content zoom"></div>
    <div id="page-over" class="page content"></div>
  </div>
  <!-- 分页测量容器 -->
  <div id="measurer" class="content"></div>
  <!-- 滚动模式 -->
  <div id="scroll-area">
    <div id="scroll-content" class="content"></div>
  </div>

  <div id="page-foot">
    <span id="foot-chap"></span>

  <!-- 点击/手势层 -->
  <div id="tap-layer">
    <div class="zone side" id="zone-prev"></div>

  </div>

  <!-- 顶栏 -->
  <header id="topbar" class="bar hidden">
    <div class="back" id="btn-back">‹</div>

</div>

<!-- 目录 -->
<aside id="drawer">
  <div class="head">
    <div class="t">心火长明</div>
    <div class="s" id="drawer-sub">青空归处 · 共 <span id="chap-count"></span> 章</div>
    <div class="search">
      <input id="search-input" type="search" placeholder="搜索书内内容" autocomplete="off">

    </div>
  </div>
  <div class="list" id="catalog"></div>
</aside>

<!-- 设置面板 -->
<div id="sheet" class="sheet">
  <div class="row">
    <div class="label">字体</div>
    <div class="opts">
      <button class="opt font-sans-demo" data-font="sans">黑体</button>
      <button class="opt font-serif-demo" data-font="serif">宋体</button>
    </div>
  </div>
  <div class="row">
    <div class="label">字号</div>

    <div class="label">行距</div>

      <button class="opt" data-lh="1.6">紧凑</button>

  <div class="row">
    <div class="label">背景</div>
    <div class="opts" style="justify-content:flex-start">
      <div class="swatch sw-light" data-theme-opt="light" title="白天"></div>
      <div class="swatch sw-eye" data-theme-opt="eye" title="护眼"></div>
      <div class="swatch sw-dark" data-theme-opt="dark" title="夜间"></div>
    </div>
  </div>
  <div class="row">
    <div class="label">翻页方式</div>
    <div class="opts">
      <button class="opt" data-mode="paged">仿真翻页</button>
      <button class="opt" data-mode="scroll">上下滚动</button>
    </div>
  </div>
</div>

<div id="mask"></div>
<div id="toast"></div>
<div id="loading">加载中…</div>

<!-- 听书悬浮播放条 -->
<div id="tts-bar">
  <button id="tts-prev" title="上一段">«</button>
  <button id="tts-play" title="播放/暂停">▶</button>
  <button id="tts-next" title="下一段">»</button>
  <button id="tts-speedbtn" title="语速">1x</button>
  <span id="tts-status"></span>
  <button id="tts-stop" title="停止">✕</button>
</div>

<!-- 听书设置面板 -->
<div id="tts-sheet" class="sheet">
  <div class="row">
    <div class="label">接口类型</div>
    <div class="opts">
      <button class="opt" data-tts-type="mimo">MiMo v2.5</button>
      <button class="opt" data-tts-type="openai">OpenAI 兼容</button>

    <input class="tin" id="tts-style" type="text" spellcheck="false" autocomplete="off">

    </div>

    <button class="opt on" id="tts-start" style="padding:12px 0">▶ 从当前位置开始听书</button>

  <div class="label" style="text-align:center;margin-bottom:0">配置仅保存在本机浏览器（localStorage），不会上传到任何服务器</div>
</div>

<script>
/* ================================================================
 * 书与章节配置
 * - series / volume：系列名与部名（换部只改 volume）
 * - 章节列表启动时自动从 GitHub 仓库「心火长明/」目录读取，无需手动维护；
 *   读取失败时退回 FALLBACK_CHAPTERS 备用清单。
 * ============================================================== */
const GITHUB = {
  owner: 'Kirarineko',
  repo: 'AzureHomebound',
};
const BOOK = {
  series: '青空归处',   // 系列名（总书名）
  volume: '心火长明',   // 部名（第一部），之后出续部时改这里即可
  dir: '心火长明',
  chapters: null,       // 启动时填充 [{file, url}]
};
// 备用清单（仅当 GitHub API 不可用时使用）
const FALLBACK_CHAPTERS = [
  '0_落地过猛.md','1_从捡到小狐娘开始.md','2_不速之客.md','3_休养.md',
  '4_再遇.md','5_跟踪.md','6_冒险家狐狐.md','7_冒险家猫猫.md',
  '8_要更新了.md','9_卸下伪装.md','10_白虹城.md','11_全副武装.md',
  '12_启航！.md'
];

/* ================= 状态 ================= */
const LS_KEY = 'xinhuo-reader-v1';
const state = Object.assign({
  chapter: 0,      // 当前章节索引
  ratio: 0,        // 章节内进度 0~1
  mode: 'paged',   // paged | scroll
  theme: 'light',  // light | eye | dark
  font: 'serif',   // sans | serif
  fontSize: 18,
  lineHeight: 1.9,
}, loadState());

let pages = [];        // 当前章节的分页结果（HTML 字符串数组）
let curPage = 0;
let animating = false; // 翻页动画进行中
let blocksCache = {};  // 章节解析缓存
let pageCache = {};    // 分页结果缓存：layoutKey -> pages

function loadState(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; } }
function saveState(){
  state.ratio = currentRatio();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function chapterFile(i){ return BOOK.chapters[i].file; }
function chapterTitle(i){
  return chapterFile(i).replace(/\.md$/,'').replace(/^\d+_/,'');
}
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ================= 章节加载与解析 ================= */
async function loadBlocks(idx){
  if(blocksCache[idx]) return blocksCache[idx];
  const entry = BOOK.chapters[idx];
  // 优先用 GitHub raw 直链（跨域可用），否则退回同源相对路径
  const res = await fetch(entry.url || (encodeURIComponent(BOOK.dir) + '/' + encodeURIComponent(entry.file)));
  if(!res.ok) throw new Error('HTTP ' + res.status);
  let text = await res.text();
  // 去除修订批注（HTML 注释）
  text = text.replace(/<!--[\s\S]*?-->/g, '');
  const blocks = [];
  for(const raw of text.split(/\n{2,}|\r\n{2,}/)){
    const block = raw.trim();
    if(!block) continue;
    if(block.startsWith('# '))       blocks.push({t:'h1', x:block.slice(2).trim()});
    else if(block.startsWith('## ')) blocks.push({t:'h2', x:block.slice(3).trim()});
    else {
      for(const line of block.split(/\r?\n/)){
        const l = line.trim();
        if(l) blocks.push({t:'p', x:l});
      }
    }
  }
  blocksCache[idx] = blocks;
  return blocks;
}

function renderBlocks(blocks){
  return blocks.map(b=>{
    if(b.t==='h1') return '<h1>'+escapeHtml(b.x)+'</h1>';
    if(b.t==='h2') return '<h2>'+escapeHtml(b.x)+'</h2>';
    return '<p>'+escapeHtml(b.x)+'</p>';
  }).join('');
}
function blockHtml(b){
  if(b.t==='h1') return '<h1>'+escapeHtml(b.x)+'</h1>';
  if(b.t==='h2') return '<h2>'+escapeHtml(b.x)+'</h2>';
  return '<p>'+escapeHtml(b.x)+'</p>';
}

/* ================= 手动分页 =================
 * 逐块放入不可见的测量容器，高度超出页面高度即换页。
 * 每页是独立的真实 DOM，杜绝多列分页的边缘漏字问题。
 * ============================================================== */
function layoutKey(idx){
  return [idx, state.font, state.fontSize, state.lineHeight,
          $('#page-over').clientWidth, $('#page-over').clientHeight].join('|');
}

function paginate(idx, blocks){
  const key = layoutKey(idx);
  if(pageCache[key]) return pageCache[key];

  const meas = $('#measurer');
  const H = $('#page-over').clientHeight;
  meas.style.width = $('#page-over').clientWidth + 'px';
  meas.style.fontSize = state.fontSize + 'px';
  meas.style.lineHeight = state.lineHeight;
  meas.style.fontFamily = getComputedStyle($('#page-over')).fontFamily;
  meas.innerHTML = '';

  const holder = document.createElement('div');
  holder.style.display = 'flow-root'; // 防止子元素 margin 坍缩影响测量
  meas.appendChild(holder);

  const result = [];
  let curHtml = [];
  let curStart = 0;
  for(let bi=0; bi<blocks.length; bi++){
    const b = blocks[bi];
    const node = document.createElement(b.t);
    node.textContent = b.x;
    holder.appendChild(node);
    if(holder.offsetHeight > H && holder.children.length > 1){
      // 超出：该块移到下一页
      holder.removeChild(node);
      result.push({html: curHtml.join(''), start: curStart});
      holder.innerHTML = '';
      holder.appendChild(node);
      curStart = bi;
      curHtml = [blockHtml(b)];
    }else{
      curHtml.push(blockHtml(b));
    }
  }
  if(curHtml.length) result.push({html: curHtml.join(''), start: curStart});
  if(!result.length) result.push({html:'', start:0});

  meas.innerHTML = '';
  // 缓存控制：最多保留 20 组分页结果
  const keys = Object.keys(pageCache);
  if(keys.length > 20) delete pageCache[keys[0]];
  pageCache[key] = result;
  return result;
}

/* ================= 翻页动画 =================
 * 上一页滑走；下一页缩小 + 模糊垫在底下，
 * 上一页完全离开后再放大回原值并变清晰。
 * ============================================================== */
function slideTurn(targetHtml, dir){
  return new Promise(resolve=>{
    const over = $('#page-over'), under = $('#page-under');
    animating = true;

    under.innerHTML = targetHtml;
    under.style.transition = 'none';
    under.classList.add('zoom');
    over.style.transition = 'none';
    over.style.transform = 'translateX(0)';
    over.classList.add(dir > 0 ? 'sliding-next' : 'sliding-prev');
    void over.offsetHeight; // 强制重排，确保初始状态生效

    // 第一阶段：当前页滑出屏幕
    over.style.transition = 'transform .32s cubic-bezier(.25,.6,.3,1)';
    over.style.transform = 'translateX(' + (dir > 0 ? '-103%' : '103%') + ')';

    const onOver = e=>{
      if(e.propertyName !== 'transform') return;
      over.removeEventListener('transitionend', onOver);
      // 第二阶段：底层页面放大回 1 并恢复清晰
      under.style.transition = 'transform .26s ease, filter .26s ease, opacity .26s ease';
      under.classList.remove('zoom');

      const onUnder = e=>{
        if(e.propertyName !== 'transform') return;
        under.removeEventListener('transitionend', onUnder);
        // 归位：顶层变为当前页，底层清空待命
        over.style.transition = 'none';
        over.style.transform = 'translateX(0)';
        over.classList.remove('sliding-next','sliding-prev');
        over.innerHTML = targetHtml;
        under.style.transition = 'none';
        under.innerHTML = '';
        under.classList.add('zoom');
        animating = false;
        resolve();
      };
      under.addEventListener('transitionend', onUnder);
    };
    over.addEventListener('transitionend', onOver);
  });
}

/* ================= 章节显示与翻页 ================= */
function pageFromRatio(r){
  return Math.max(0, Math.min(pages.length-1, Math.round((r||0) * Math.max(0, pages.length-1))));
}
function currentRatio(){
  if(state.mode === 'paged'){
    return pages.length > 1 ? curPage / (pages.length-1) : 0;
  }
  const area = $('#scroll-area');
  const max = area.scrollHeight - area.clientHeight;
  return max > 0 ? area.scrollTop / max : 0;
}

function updateChrome(){
  const title = chapterTitle(state.chapter);
  $('#topbar-chap').textContent = title;
  $('#foot-chap').textContent = title;
  $('#foot-page').textContent = (curPage+1) + ' / ' + Math.max(1, pages.length);
  document.title = title + ' · ' + BOOK.series + '：' + BOOK.volume;
  markCatalogCurrent();
}

async function showChapter(idx, ratio){
  idx = Math.max(0, Math.min(BOOK.chapters.length-1, idx));
  state.chapter = idx;
  $('#loading').style.display = 'grid';
  try{
    const blocks = await loadBlocks(idx);
    $('#scroll-content').innerHTML = renderBlocks(blocks);
    if(state.mode === 'paged'){
      pages = paginate(idx, blocks);
      curPage = pageFromRatio(ratio);
      $('#page-over').innerHTML = pages[curPage].html || '';
      $('#page-under').innerHTML = '';
      $('#scroll-area').scrollTop = 0;
    }else{
      pages = [];
      curPage = 0;
      requestAnimationFrame(()=>{
        const area = $('#scroll-area');
        const max = area.scrollHeight - area.clientHeight;
        area.scrollTop = max > 0 ? (ratio||0) * max : 0;
      });
    }
    updateChrome();
    $('#loading').style.display = 'none';
    saveState();
  }catch(e){
    $('#loading').textContent = '章节加载失败：' + e.message;
  }
}

/* 带动画翻到指定章节指定页 */
async function turnTo(chap, page, dir){
  if(animating) return;
  animating = true;
  try{
    let targetPages;
    if(chap === state.chapter){
      targetPages = pages;
    }else{
      const blocks = await loadBlocks(chap);
      targetPages = paginate(chap, blocks);
      $('#scroll-content').innerHTML = renderBlocks(blocks);
    }
    page = Math.max(0, Math.min(targetPages.length-1, page));
    const html = (targetPages[page] && targetPages[page].html) || '';
    animating = false; // slideTurn 内部自行管理
    await slideTurn(html, dir);
    state.chapter = chap;
    pages = targetPages;
    curPage = page;
    updateChrome();
    saveState();
  }catch(e){
    animating = false;
    toast('加载失败：' + e.message);
  }
}

function nextPage(){
  if(animating) return;
  if(curPage < pages.length-1) turnTo(state.chapter, curPage+1, 1);
  else if(state.chapter < BOOK.chapters.length-1) turnTo(state.chapter+1, 0, 1);
  else toast('已经是最后一章了');
}
function prevPage(){
  if(animating) return;
  if(curPage > 0) turnTo(state.chapter, curPage-1, -1);
  else if(state.chapter > 0){
    // 上一章末页：页数要先分页才知道，用极大值交由 turnTo 收敛
    turnTo(state.chapter-1, 1e9, -1);
  } else toast('已经是第一章了');
}

/* 字号/行距/字体/尺寸变化后重新分页，保持阅读位置 */
async function relayout(){
  if(state.mode !== 'paged') return;
  const r = currentRatio();
  try{
    const blocks = await loadBlocks(state.chapter);
    pages = paginate(state.chapter, blocks);
    curPage = pageFromRatio(r);
    $('#page-over').innerHTML = pages[curPage].html || '';
    $('#foot-page').textContent = (curPage+1) + ' / ' + Math.max(1, pages.length);
    saveState();
  }catch(e){/* 忽略 */}
}

/* ================= 书内搜索 ================= */
function markQuery(rawText, q){
  const esc = escapeHtml(rawText);
  if(!q) return esc;
  const escQ = escapeHtml(q);
  if(!escQ) return esc;
  const re = new RegExp(escQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  return esc.replace(re, m => '<mark>' + m + '</mark>');
}
function highlightBlock(b, q){
  const inner = markQuery(b.x, q);
  if(b.t==='h1') return '<h1>'+inner+'</h1>';
  if(b.t==='h2') return '<h2>'+inner+'</h2>';
  return '<p>'+inner+'</p>';
}

let searchSeq = 0;
async function doSearch(q){
  const seq = ++searchSeq;
  const box = $('#catalog');
  box.innerHTML = '<div class="sr-head">搜索中…</div>';
  const groups = [];
  let total = 0;
  const ql = q.toLowerCase();
  for(let ci=0; ci<BOOK.chapters.length; ci++){
    let blocks;
    try{ blocks = await loadBlocks(ci); }catch(e){ continue; }
    if(seq !== searchSeq) return; // 已有更新的搜索
    const items = [];
    for(let bi=0; bi<blocks.length; bi++){
      const text = blocks[bi].x;
      const pos = text.toLowerCase().indexOf(ql);
      if(pos >= 0){
        const from = Math.max(0, pos-12);
        const to = Math.min(text.length, pos + q.length + 18);
        const snip = (from>0?'…':'') + text.slice(from, to) + (to<text.length?'…':'');
        items.push({block: bi, html: markQuery(snip, q)});
        total++;
        if(total >= 300) break;
      }
    }
    if(items.length) groups.push({chap: ci, items});
    if(total >= 300) break;
  }
  if(seq !== searchSeq) return;
  renderSearchResults(groups, total, q);
}

function renderSearchResults(groups, total, q){
  const box = $('#catalog');
  box.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'sr-head';
  head.textContent = total
    ? ('共 ' + total + ' 处结果' + (total>=300 ? '（仅显示前 300）' : ''))
    : ('没有找到「' + q + '」');
  box.appendChild(head);
  for(const g of groups){
    for(const it of g.items){
      const div = document.createElement('div');
      div.className = 'sr-item';
      div.innerHTML = '<div class="c">' + String(g.chap+1).padStart(2,'0') + ' ' + escapeHtml(chapterTitle(g.chap)) +
                      '</div><div class="s2">' + it.html + '</div>';
      div.addEventListener('click', ()=> jumpToBlock(g.chap, it.block, q));
      box.appendChild(div);
    }
  }
}

/* 跳转到指定章节的指定段落，并高亮关键词 */
async function jumpToBlock(chapIdx, blockIdx, q){
  closePanels(); hideUI();
  $('#search-input').blur();
  try{
    const blocks = await loadBlocks(chapIdx);
    if(state.mode === 'paged'){
      const pgs = paginate(chapIdx, blocks);
      let p = 0;
      for(let i=0; i<pgs.length; i++){ if(pgs[i].start <= blockIdx) p = i; else break; }
      state.chapter = chapIdx; pages = pgs; curPage = p;
      $('#scroll-content').innerHTML = renderBlocks(blocks);
      const end = (p+1 < pgs.length) ? pgs[p+1].start : blocks.length;
      let html = '';
      for(let bi=pgs[p].start; bi<end; bi++){
        html += highlightBlock(blocks[bi], bi === blockIdx ? q : null);
      }
      $('#page-over').innerHTML = html;
      $('#page-under').innerHTML = '';
      updateChrome(); saveState();
    }else{
      state.chapter = chapIdx;
      $('#scroll-content').innerHTML = renderBlocks(blocks);
      pages = []; curPage = 0;
      updateChrome();
      requestAnimationFrame(()=>{
        const el = $('#scroll-content').children[blockIdx];
        if(el){
          el.innerHTML = markQuery(blocks[blockIdx].x, q);
          el.scrollIntoView({block:'center'});
        }
        setTimeout(saveState, 500);
      });
    }
  }catch(e){ toast('跳转失败：' + e.message); }
}

const searchInput = $('#search-input');
let searchTimer = null;
searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim();
  $('#search-clear').classList.toggle('show', !!searchInput.value);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{
    if(!q){ searchSeq++; renderCatalogItems(); }
    else doSearch(q);
  }, 300);
});
$('#search-clear').addEventListener('click', ()=>{
  searchInput.value = '';
  $('#search-clear').classList.remove('show');
  searchSeq++;
  renderCatalogItems();
  searchInput.focus();
});

/* ================= 听书（TTS） =================
 * 支持两种协议：
 * - mimo  ：MiMo v2.5，POST {endpoint}（chat/completions，stream:true），
 *           整章文本放 assistant 消息一次性合成（避免句子间割裂），
 *           SSE 流式返回 choices[0].delta.audio.data（base64 PCM16 24kHz mono），
 *           Web Audio 按时间线调度实现无缝播放；章节粒度控制
 *          （整章连播，不做段落级高亮/定位，仅章节间自动跳转）
 * - openai：通用 OpenAI 兼容 POST {endpoint}（/audio/speech 形式），
 *           {model, input, voice, response_format}，返回音频二进制，逐段播放
 * 配置仅保存在 localStorage（xinhuo-tts-v1）。
 * ============================================================== */
const TTS_LS_KEY = 'xinhuo-tts-v1';
const TTS_PRESETS = {
  mimo: {
    endpoint: 'https://api.xiaomimimo.com/v1/chat/completions',
    model: 'mimo-v2.5-tts',
    voices: ['冰糖','茉莉','苏打','白桦','mimo_default']
  },
  openai: {
    endpoint: 'https://api.openai.com/v1/audio/speech',
    model: 'gpt-4o-mini-tts',
    voices: ['alloy','ash','coral','echo','fable','nova','onyx','sage','shimmer']
  }
};
const ttsCfg = Object.assign({
  type: 'mimo',
  endpoint: TTS_PRESETS.mimo.endpoint,
  apiKey: '',
  model: TTS_PRESETS.mimo.model,
  voice: TTS_PRESETS.mimo.voices[0],
  speed: 1,
  style: ''
}, loadTtsCfg());

function loadTtsCfg(){ try{ return JSON.parse(localStorage.getItem(TTS_LS_KEY)) || {}; }catch(e){ return {}; } }
function saveTtsCfg(){ try{ localStorage.setItem(TTS_LS_KEY, JSON.stringify(ttsCfg)); }catch(e){} }

const ttsAudio = new Audio();
const tts = { active:false, playing:false, engine:'paragraph', blocks:null, blockIdx:0, token:0, cache:new Map() };

function ttsErrMsg(e){
  const m = (e && e.message) || String(e);
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return '网络/CORS 错误，请检查 API 地址，或确认该服务商允许网页直接调用';
  return m;
}

/* openai 兼容协议：/audio/speech 逐段请求（mimo 协议走下方流式整章引擎） */
async function ttsFetchAudio(text){
  const headers = {'Content-Type':'application/json'};
  if(ttsCfg.apiKey) headers['Authorization'] = 'Bearer ' + ttsCfg.apiKey;
  const res = await fetch(ttsCfg.endpoint, {
    method:'POST', headers,
    body: JSON.stringify({model: ttsCfg.model, input: text, voice: ttsCfg.voice, response_format:'mp3'})
  });
  if(!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0,150));
  return await res.blob();
}

/* ---------- MiMo 流式整章引擎（SSE + Web Audio） ---------- */
const TTS_SAMPLE_RATE = 24000;
let ttsAC = null; // AudioContext，首次点击时创建

const stm = {
  chunks: [],        // 已接收的 Float32Array 音频块
  samples: 0,        // 已接收采样总数
  sources: [],       // 已调度的音源节点
  nextTime: 0,       // 下一块音频的调度时间（AudioContext 时钟）
  anchorSample: 0,   // 播放位置锚点：采样数
  anchorTime: 0,     // 锚点对应的 AudioContext 时间
  rate: 1,           // 播放倍速
  done: false,       // 流是否结束
  timer: null,       // 状态/结束轮询
  controller: null   // fetch AbortController
};

function pcmB64ToF32(b64){
  const bin = atob(b64);
  const n = bin.length >> 1;
  const out = new Float32Array(n);
  for(let i=0;i<n;i++){
    let v = bin.charCodeAt(i*2) | (bin.charCodeAt(i*2+1) << 8);
    if(v >= 32768) v -= 65536;
    out[i] = v / 32768;
  }
  return out;
}

/* 当前播放位置（秒） */
function stmPlayhead(){
  if(!ttsAC) return 0;
  return stm.anchorSample / TTS_SAMPLE_RATE +
         Math.max(0, ttsAC.currentTime - stm.anchorTime) * stm.rate;
}

/* 把一块 PCM 排到时间线上（无缝衔接） */
function stmSchedule(f32){
  if(!f32.length) return;
  stm.chunks.push(f32);
  stm.samples += f32.length;
  const buf = ttsAC.createBuffer(1, f32.length, TTS_SAMPLE_RATE);
  buf.getChannelData(0).set(f32);
  const src = ttsAC.createBufferSource();
  src.buffer = buf;
  src.playbackRate.value = stm.rate;
  src.connect(ttsAC.destination);
  const t = Math.max(stm.nextTime, ttsAC.currentTime + 0.03);
  src.start(t);
  stm.nextTime = t + buf.duration / stm.rate;
  stm.sources.push(src);
  if(stm.sources.length > 64){
    src.onended = ()=>{ const i = stm.sources.indexOf(src); if(i>=0) stm.sources.splice(i,1); };
  }
}

/* 跳转到指定采样位置：停掉已调度音源，把 seek 点之后的缓冲重新拼接调度 */
function stmSeek(sampleOffset){
  for(const s of stm.sources){ try{ s.stop(); }catch(e){} }
  stm.sources = [];
  sampleOffset = Math.max(0, Math.min(sampleOffset, stm.samples));
  const tail = stm.samples - sampleOffset;
  if(tail > 0){
    const merged = new Float32Array(tail);
    let skip = sampleOffset, off = 0;
    for(const c of stm.chunks){
      if(skip >= c.length){ skip -= c.length; continue; }
      const part = c.subarray(skip);
      merged.set(part, off); off += part.length; skip = 0;
    }
    const buf = ttsAC.createBuffer(1, merged.length, TTS_SAMPLE_RATE);
    buf.getChannelData(0).set(merged);
    const src = ttsAC.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = stm.rate;
    src.connect(ttsAC.destination);
    const t = ttsAC.currentTime + 0.05;
    src.start(t);
    stm.sources.push(src);
    stm.anchorSample = sampleOffset;
    stm.anchorTime = t;
    stm.nextTime = t + merged.length / TTS_SAMPLE_RATE / stm.rate;
  }else{
    stm.anchorSample = sampleOffset;
    stm.anchorTime = ttsAC.currentTime;
    stm.nextTime = ttsAC.currentTime + 0.03;
  }
}

/* SSE 流式请求：整章一次性合成，逐块调度播放 */
async function stmFetchChapter(text){
  const headers = {'Content-Type':'application/json'};
  if(ttsCfg.apiKey) headers['Authorization'] = 'Bearer ' + ttsCfg.apiKey;
  const messages = [];
  if(ttsCfg.style) messages.push({role:'user', content: ttsCfg.style});
  messages.push({role:'assistant', content: text});
  const res = await fetch(ttsCfg.endpoint, {
    method:'POST', headers,
    body: JSON.stringify({model: ttsCfg.model, messages, audio:{format:'pcm16', voice: ttsCfg.voice}, stream: true}),
    signal: stm.controller.signal
  });
  if(!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0,150));
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  for(;;){
    const {done, value} = await reader.read();
    if(done) break;
    buf += decoder.decode(value, {stream:true});
    let idx;
    while((idx = buf.indexOf('\n')) >= 0){
      const line = buf.slice(0, idx).trim();
      buf = buf.slice(idx+1);
      if(!line.startsWith('data:')) continue;
      const payload = line.slice(5).trim();
      if(payload === '[DONE]'){ stm.done = true; return; }
      try{
        const json = JSON.parse(payload);
        const audio = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.audio;
        if(audio && audio.data) stmSchedule(pcmB64ToF32(audio.data));
      }catch(e){/* 忽略坏行 */}
    }
  }
  stm.done = true;
}

/* 轮询：刷新状态、检测本章播放结束 */
function stmTick(){
  if(!tts.active || tts.engine !== 'stream') return;
  const played = stmPlayhead();
  const buffered = stm.samples / TTS_SAMPLE_RATE;
  $('#tts-status').textContent = (stm.done ? '' : '合成中·') + Math.floor(played) + 's / ' + Math.floor(buffered) + 's';
  if(stm.done && played >= buffered - 0.1){
    clearInterval(stm.timer);
    ttsNextChapter();
  }
}

/* 启动/重启整章流式播放（固定从本章开头开始） */
async function ttsStartStreamFrom(){
  const token = ++tts.token;
  if(stm.controller){ try{ stm.controller.abort(); }catch(e){} }
  clearInterval(stm.timer);
  for(const s of stm.sources){ try{ s.stop(); }catch(e){} }
  stm.sources = []; stm.chunks = []; stm.samples = 0; stm.done = false;
  stm.rate = ttsCfg.speed;
  if(!ttsAC) ttsAC = new (window.AudioContext || window.webkitAudioContext)();
  await ttsAC.resume().catch(()=>{});
  stm.anchorSample = 0;
  stm.anchorTime = ttsAC.currentTime;
  stm.nextTime = ttsAC.currentTime + 0.05;
  $('#tts-status').textContent = '合成中…';
  stm.timer = setInterval(stmTick, 400);
  stm.controller = new AbortController();
  const text = tts.blocks.map(b=>b.x).join('\n');
  stmFetchChapter(text).catch(e=>{
    if(token !== tts.token) return;
    stm.done = true;
    if(stm.samples === 0){
      $('#tts-status').textContent = '出错';
      ttsSetPlayIcon(false);
      toast('语音合成失败：' + ttsErrMsg(e));
    }
  });
  ttsSetPlayIcon(true);
}

/* 倍速：两套引擎通用 */
function ttsApplySpeed(s){
  ttsCfg.speed = s;
  ttsAudio.playbackRate = s;
  if(tts.active && tts.engine === 'stream' && ttsAC){
    const ph = stmPlayhead();
    stm.rate = s;
    stmSeek(Math.floor(ph * TTS_SAMPLE_RATE));
  }
  saveTtsCfg(); applyTtsUI();
}

/* ---------- 播放引擎 ---------- */
function ttsSetPlayIcon(playing){
  tts.playing = playing;
  $('#tts-play').textContent = playing ? '❚❚' : '▶';
}

function ttsBlockHtml(b, active){
  const cls = active ? ' class="tts-cur"' : '';
  if(b.t==='h1') return '<h1'+cls+'>'+escapeHtml(b.x)+'</h1>';
  if(b.t==='h2') return '<h2'+cls+'>'+escapeHtml(b.x)+'</h2>';
  return '<p'+cls+'>'+escapeHtml(b.x)+'</p>';
}

/* 高亮当前朗读段落，并让页面跟随朗读位置 */
function ttsRenderHighlight(){
  if(!tts.blocks) return;
  if(state.mode === 'paged'){
    if(!pages.length) return;
    let p = 0;
    for(let i=0;i<pages.length;i++){ if(pages[i].start <= tts.blockIdx) p = i; else break; }
    curPage = p;
    const end = (p+1 < pages.length) ? pages[p+1].start : tts.blocks.length;
    let html = '';
    for(let bi=pages[p].start; bi<end; bi++) html += ttsBlockHtml(tts.blocks[bi], bi===tts.blockIdx);
    $('#page-over').innerHTML = html;
    $('#page-under').innerHTML = '';
    $('#foot-page').textContent = (p+1) + ' / ' + Math.max(1, pages.length);
  }else{
    const kids = $('#scroll-content').children;
    for(let i=0;i<kids.length;i++) kids[i].classList.toggle('tts-cur', i===tts.blockIdx);
    const el = kids[tts.blockIdx];
    if(el) el.scrollIntoView({block:'center', behavior:'smooth'});
  }
}
function ttsClearHighlight(){
  if(state.mode === 'paged'){
    if(pages.length && pages[curPage]) $('#page-over').innerHTML = pages[curPage].html || '';
  }else{
    for(const el of document.querySelectorAll('#scroll-content .tts-cur')) el.classList.remove('tts-cur');
  }
}

function currentStartBlock(){
  if(state.mode === 'paged'){
    return pages.length ? pages[curPage].start : 0;
  }
  const area = $('#scroll-area');
  const kids = $('#scroll-content').children;
  for(let i=0;i<kids.length;i++){
    if(kids[i].offsetTop + kids[i].offsetHeight > area.scrollTop) return i;
  }
  return 0;
}

async function ttsPlayBlock(i){
  const token = ++tts.token;
  tts.blockIdx = i;
  $('#tts-status').textContent = '第 ' + (i+1) + '/' + tts.blocks.length + ' 段';
  ttsRenderHighlight();
  try{
    const key = state.chapter + ':' + i;
    let url = tts.cache.get(key);
    if(!url){
      $('#tts-status').textContent = '合成中… ' + (i+1) + '/' + tts.blocks.length;
      const blob = await ttsFetchAudio(tts.blocks[i].x);
      url = URL.createObjectURL(blob);
      tts.cache.set(key, url);
    }
    if(token !== tts.token) return;
    $('#tts-status').textContent = '第 ' + (i+1) + '/' + tts.blocks.length + ' 段';
    ttsAudio.src = url;
    ttsAudio.playbackRate = ttsCfg.speed;
    await ttsAudio.play();
    if(token !== tts.token) return;
    ttsSetPlayIcon(true);
    ttsPrefetch(i+1);
  }catch(e){
    if(token !== tts.token) return;
    ttsSetPlayIcon(false);
    $('#tts-status').textContent = '出错';
    toast('语音合成失败：' + ttsErrMsg(e));
  }
}
function ttsPrefetch(i){
  if(!tts.blocks || i >= tts.blocks.length) return;
  const key = state.chapter + ':' + i;
  if(tts.cache.has(key)) return;
  ttsFetchAudio(tts.blocks[i].x)
    .then(blob => tts.cache.set(key, URL.createObjectURL(blob)))
    .catch(()=>{});
}

async function ttsNextChapter(){
  if(state.chapter >= BOOK.chapters.length-1){ ttsStop(); toast('已读完最后一章'); return; }
  $('#tts-status').textContent = '加载下一章…';
  await showChapter(state.chapter+1, 0);
  tts.blocks = await loadBlocks(state.chapter);
  tts.blockIdx = 0;
  ttsMediaSession();
  if(tts.engine === 'stream') ttsStartStreamFrom();
  else ttsPlayBlock(0);
}

async function ttsStart(){
  if(!ttsCfg.apiKey){ toast('请先填写 API Key'); openTtsSheet(); return; }
  if(tts.active) ttsStop();   // 先停掉可能正在进行的播放
  try{ tts.blocks = await loadBlocks(state.chapter); }
  catch(e){ toast('章节加载失败：' + e.message); return; }
  tts.blockIdx = currentStartBlock();
  tts.active = true;
  tts.engine = ttsCfg.type === 'mimo' ? 'stream' : 'paragraph';
  $('#tts-bar').classList.add('show');
  ttsMediaSession();
  if(tts.engine === 'stream') ttsStartStreamFrom();
  else ttsPlayBlock(tts.blockIdx);
}
function ttsStop(){
  tts.token++;
  tts.active = false;
  // 流式引擎清理
  if(stm.controller){ try{ stm.controller.abort(); }catch(e){} }
  clearInterval(stm.timer);
  for(const s of stm.sources){ try{ s.stop(); }catch(e){} }
  stm.sources = []; stm.chunks = []; stm.samples = 0;
  if(ttsAC) ttsAC.suspend().catch(()=>{});
  // 逐段引擎清理
  ttsAudio.pause();
  ttsAudio.removeAttribute('src');
  ttsAudio.load();
  for(const u of tts.cache.values()) URL.revokeObjectURL(u);
  tts.cache.clear();
  $('#tts-bar').classList.remove('show');
  ttsClearHighlight();
  ttsSetPlayIcon(false);
  if('mediaSession' in navigator){ try{ navigator.mediaSession.metadata = null; }catch(e){} }
}
function ttsToggle(){
  if(!tts.active) return;
  if(tts.engine === 'stream'){
    if(!ttsAC) return;
    if(ttsAC.state === 'running'){ ttsAC.suspend(); ttsSetPlayIcon(false); }
    else{ ttsAC.resume(); ttsSetPlayIcon(true); }
    return;
  }
  if(ttsAudio.paused){
    ttsAudio.play().then(()=>ttsSetPlayIcon(true)).catch(e=>toast('播放失败：' + ttsErrMsg(e)));
  }else{
    ttsAudio.pause();
    ttsSetPlayIcon(false);
  }
}
function ttsSkip(d){
  if(!tts.active || !tts.blocks) return;
  // 流式整章模式下为章节粒度：« 重读本章，» 下一章
  if(tts.engine === 'stream'){
    if(d < 0){ stmSeek(0); toast('回到本章开头'); }
    else ttsNextChapter();
    return;
  }
  const ni = tts.blockIdx + d;
  if(ni < 0){ toast('已经是第一段了'); return; }
  if(ni >= tts.blocks.length){ ttsNextChapter(); return; }
  ttsPlayBlock(ni);
}
function ttsMediaSession(){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: chapterTitle(state.chapter),
      artist: BOOK.series + '：' + BOOK.volume
    });
    navigator.mediaSession.setActionHandler('play', ttsToggle);
    navigator.mediaSession.setActionHandler('pause', ttsToggle);
    navigator.mediaSession.setActionHandler('previoustrack', ()=>ttsSkip(-1));
    navigator.mediaSession.setActionHandler('nexttrack', ()=>ttsSkip(1));
  }catch(e){}
}

ttsAudio.addEventListener('ended', ()=>{
  if(!tts.active || tts.engine !== 'paragraph' || !tts.blocks) return;
  if(tts.blockIdx + 1 < tts.blocks.length) ttsPlayBlock(tts.blockIdx + 1);
  else ttsNextChapter();
});

/* ---------- 听书设置界面 ---------- */
function openTtsSheet(){
  $('#drawer').classList.remove('show');
  document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show'));
  $('#tts-sheet').classList.add('show');
  $('#mask').classList.add('show');
}
function applyTtsUI(){
  document.querySelectorAll('[data-tts-type]').forEach(b=>b.classList.toggle('on', b.dataset.ttsType === ttsCfg.type));
  $('#tts-endpoint').value = ttsCfg.endpoint;
  $('#tts-key').value = ttsCfg.apiKey;
  $('#tts-model').value = ttsCfg.model;
  $('#tts-voice').value = ttsCfg.voice;
  $('#tts-style').value = ttsCfg.style;
  $('#tts-style-row').style.display = ttsCfg.type === 'mimo' ? '' : 'none';
  const dl = $('#tts-voices');
  dl.innerHTML = '';
  (TTS_PRESETS[ttsCfg.type].voices || []).forEach(v=>{
    const o = document.createElement('option');
    o.value = v;
    dl.appendChild(o);
  });
  document.querySelectorAll('#tts-sheet [data-speed]').forEach(b=>b.classList.toggle('on', parseFloat(b.dataset.speed) === ttsCfg.speed));
  $('#tts-speedbtn').textContent = ttsCfg.speed + 'x';
  $('#tts-start').textContent = ttsCfg.type === 'mimo' ? '▶ 从本章开头开始听书' : '▶ 从当前位置开始听书';
}

$('#btn-tts').addEventListener('click', openTtsSheet);
$('#tts-start').addEventListener('click', ()=>{ closePanels(); hideUI(); ttsStart(); });
$('#tts-play').addEventListener('click', ttsToggle);
$('#tts-stop').addEventListener('click', ttsStop);
$('#tts-prev').addEventListener('click', ()=>ttsSkip(-1));
$('#tts-next').addEventListener('click', ()=>ttsSkip(1));
$('#tts-speedbtn').addEventListener('click', ()=>{
  const S = [0.75, 1, 1.25, 1.5, 2];
  const i = (S.indexOf(ttsCfg.speed) + 1) % S.length;
  ttsApplySpeed(S[i]);
});
document.querySelectorAll('[data-tts-type]').forEach(b=>b.addEventListener('click', ()=>{
  ttsCfg.type = b.dataset.ttsType;
  const p = TTS_PRESETS[ttsCfg.type];
  ttsCfg.endpoint = p.endpoint;
  ttsCfg.model = p.model;
  ttsCfg.voice = p.voices[0];
  saveTtsCfg(); applyTtsUI();
}));
document.querySelectorAll('#tts-sheet [data-speed]').forEach(b=>b.addEventListener('click', ()=>{
  ttsApplySpeed(parseFloat(b.dataset.speed));
}));
[['#tts-endpoint','endpoint'],['#tts-key','apiKey'],['#tts-model','model'],['#tts-voice','voice'],['#tts-style','style']]
.forEach(([sel, key])=>{
  $(sel).addEventListener('input', e=>{ ttsCfg[key] = e.target.value.trim(); saveTtsCfg(); });
});

/* ================= 事件绑定 ================= */
$('#zone-prev').addEventListener('click', ()=>{ if(!uiVisible) prevPage(); });
$('#zone-next').addEventListener('click', ()=>{ if(!uiVisible) nextPage(); });
$('#zone-mid').addEventListener('click', toggleUI);

// 滑动手势（翻页模式）
let touchX = 0, touchY = 0;
$('#stage').addEventListener('touchstart', e=>{
  touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
}, {passive:true});
$('#stage').addEventListener('touchend', e=>{
  if(state.mode !== 'paged' || uiVisible) return;
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if(Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4){
    dx < 0 ? nextPage() : prevPage();
  }
}, {passive:true});

// 键盘
document.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight' || e.key === 'PageDown'){ state.mode==='paged' ? nextPage() : $('#scroll-area').scrollBy({top:innerHeight*0.9,behavior:'smooth'}); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ state.mode==='paged' ? prevPage() : $('#scroll-area').scrollBy({top:-innerHeight*0.9,behavior:'smooth'}); }
  else if(e.key === 'Escape'){ closePanels(); hideUI(); }
});

// 底栏
$('#btn-catalog').addEventListener('click', openDrawer);
$('#btn-settings').addEventListener('click', openSheet);
$('#btn-back').addEventListener('click', hideUI);
$('#btn-mode').addEventListener('click', ()=>{
  switchMode(state.mode === 'paged' ? 'scroll' : 'paged');
});
$('#btn-theme').addEventListener('click', ()=>{
  state.theme = state.theme === 'light' ? 'dark' : (state.theme === 'dark' ? 'eye' : 'light');
  applySettings(); saveState();
});

// 遮罩
$('#mask').addEventListener('click', closePanels);

// 设置面板
document.querySelectorAll('.sheet [data-font]').forEach(b=>b.addEventListener('click', ()=>{
  state.font = b.dataset.font; applySettings(); relayout(); saveState();
}));
document.querySelectorAll('.sheet [data-lh]').forEach(b=>b.addEventListener('click', ()=>{
  state.lineHeight = parseFloat(b.dataset.lh); applySettings(); relayout(); saveState();
}));
document.querySelectorAll('.sheet [data-theme-opt]').forEach(b=>b.addEventListener('click', ()=>{
  state.theme = b.dataset.themeOpt; applySettings(); saveState();
}));
document.querySelectorAll('.sheet [data-mode]').forEach(b=>b.addEventListener('click', ()=>{
  switchMode(b.dataset.mode);
}));
$('#fs-minus').addEventListener('click', ()=>{
  state.fontSize = Math.max(14, state.fontSize - 1);
  applySettings(); relayout(); saveState();
});
$('#fs-plus').addEventListener('click', ()=>{
  state.fontSize = Math.min(28, state.fontSize + 1);
  applySettings(); relayout(); saveState();
});

// 滚动模式：记录进度
let scrollSaveTimer = null;
$('#scroll-area').addEventListener('scroll', ()=>{
  clearTimeout(scrollSaveTimer);
  scrollSaveTimer = setTimeout(saveState, 400);
}, {passive:true});

// 窗口尺寸变化
let resizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(relayout, 150);
});
window.addEventListener('beforeunload', saveState);

// 网络字体加载完成后字宽会变，重新分页一次
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>relayout());
}

/* ================= 章节自动发现（GitHub API） ================= */
async function discoverChapters(){
  const CACHE_KEY = 'xinhuo-chapters-v2';
  let cached = null;
  try{ cached = JSON.parse(localStorage.getItem(CACHE_KEY)); }catch(e){}
  const fresh = cached && cached.list && cached.list.length && (Date.now() - cached.ts < 10*60*1000);

  let list = fresh ? cached.list : null;
  if(!list){
    try{
      const res = await fetch('https://api.github.com/repos/' + GITHUB.owner + '/' + GITHUB.repo + '/contents/' + encodeURIComponent(BOOK.dir));
      if(res.ok){
        const arr = await res.json();
        if(Array.isArray(arr)){
          const num = n => { const m = n.match(/^(\d+)/); return m ? parseInt(m[1],10) : 1e9; };
          list = arr
            .filter(x => x.name.endsWith('.md') && !x.name.startsWith('.'))
            .sort((a,b)=> num(a.name) - num(b.name) || a.name.localeCompare(b.name))
            .map(x => ({file: x.name, url: x.download_url || null}));
        }
      }
    }catch(e){ list = null; }
    if(list && list.length){
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ts: Date.now(), list})); }catch(e){}
    }
  }
  // 网络失败时先用过期缓存，其次用内置备用清单
  if(!list || !list.length){
    if(cached && cached.list && cached.list.length) list = cached.list;
    else list = FALLBACK_CHAPTERS.map(f => ({file: f, url: null}));
  }
  BOOK.chapters = list;
}

/* ================= 启动 ================= */
(async function init(){
  if(location.protocol === 'file:'){
    $('#loading').textContent = '请通过本地服务器或 GitHub Pages 访问（file:// 协议无法加载章节）';
    return;
  }
  await discoverChapters();
  // 保存的章节号超出范围时收敛到最后一章
  if(state.chapter >= BOOK.chapters.length) state.chapter = Math.max(0, BOOK.chapters.length - 1);
  buildCatalog();
  applySettings();
  applyTtsUI();
  showChapter(state.chapter, state.ratio);
})();
</script>
