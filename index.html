<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>青空归处：心火长明</title>
<meta name="description" content="《心火长明》在线阅读">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============ 主题变量 ============ */
:root{
  --accent:#e05d4e;
  --radius:12px;
}
html[data-theme="light"]{
  --bg:#f7f2e8; --text:#3b3733; --muted:#9a9187;
  --bar-bg:rgba(255,253,248,.96); --bar-text:#4a453f; --border:#e6ded0;
  --panel-bg:#fffdf8; --hover:rgba(0,0,0,.05);
}
html[data-theme="eye"]{
  --bg:#d3e4cf; --text:#33402f; --muted:#7c8a76;
  --bar-bg:rgba(233,243,230,.96); --bar-text:#3c4a38; --border:#c2d4bd;
  --panel-bg:#eaf3e6; --hover:rgba(0,0,0,.05);
}
html[data-theme="dark"]{
  --bg:#161616; --text:#9c9c9c; --muted:#5c5c5c;
  --bar-bg:rgba(31,31,31,.96); --bar-text:#b5b5b5; --border:#2c2c2c;
  --panel-bg:#1f1f1f; --hover:rgba(255,255,255,.07);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--text);
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  transition:background .3s,color .3s;
  user-select:none;-webkit-user-select:none;
}

/* ============ 阅读区 ============ */
#stage{position:fixed;inset:0}

/* 翻页模式：上下两层真实页面 */
#page-area{
  position:absolute;inset:0;
  padding:calc(18px + env(safe-area-inset-top)) 20px calc(46px + env(safe-area-inset-bottom));
  overflow:hidden;
}
.page{
  position:absolute;
  top:calc(18px + env(safe-area-inset-top));
  bottom:calc(46px + env(safe-area-inset-bottom));
  left:20px;right:20px;
  overflow:hidden;
  background:var(--bg);
  transition:background .3s;
}
#page-under{z-index:1}
#page-over{z-index:2}
/* 垫在底下的页面：缩小 + 模糊 + 变暗 */
.page.zoom{
  transform:scale(.94);
  filter:blur(4px);
  opacity:.7;
}
/* 正在滑走的页面：投影增强层次 */
.page.sliding-next{box-shadow:-14px 0 30px rgba(0,0,0,.22)}
.page.sliding-prev{box-shadow:14px 0 30px rgba(0,0,0,.22)}

/* 滚动模式 */
#scroll-area{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
#scroll-content{max-width:680px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 22px calc(60vh)}

body.mode-scroll #page-area{display:none}
body.mode-scroll #scroll-area{display:block}

/* 正文排版（两种模式共用） */
.content{font-size:18px;line-height:1.9}
.content h1{font-size:1.28em;font-weight:700;margin:0 0 1.1em;line-height:1.5}
.content h2{font-size:1.05em;font-weight:600;margin:1.2em 0 .8em;color:var(--muted)}
.content p{margin:0 0 .7em;text-indent:2em;text-align:justify;word-break:break-word}

.font-sans .content, .content.font-sans{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
.font-serif .content, .content.font-serif{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif}

/* 分页测量容器（不可见） */
#measurer{position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none}

/* 页脚信息（翻页模式） */
#page-foot{
  position:absolute;left:20px;right:20px;bottom:calc(12px + env(safe-area-inset-bottom));
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--muted);pointer-events:none;z-index:3;
}
body.mode-scroll #page-foot{display:none}

/* ============ 点击层 ============ */
#tap-layer{position:absolute;inset:0;display:flex;z-index:5}
#tap-layer .zone{flex:1}
#tap-layer .zone.mid{flex:1.4}
body.mode-scroll #tap-layer .zone.side{display:none}
body.mode-scroll #tap-layer .zone{flex:1}

/* ============ 顶栏 / 底栏 ============ */
.bar{
  position:absolute;left:0;right:0;z-index:20;
  background:var(--bar-bg);color:var(--bar-text);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:transform .25s ease,background .3s;
}
#topbar{
  top:0;display:flex;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  border-bottom:1px solid var(--border);
}
#topbar.hidden{transform:translateY(-110%)}
#topbar .back{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;cursor:pointer;font-size:18px}
#topbar .back:hover{background:var(--hover)}
#topbar .book{font-weight:700;font-size:15px;white-space:nowrap}
#topbar .chap{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#bottombar{
  bottom:0;display:flex;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);
}
#bottombar.hidden{transform:translateY(110%)}
#bottombar button{
  flex:1;background:none;border:none;color:var(--bar-text);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:12px;padding:6px 0;cursor:pointer;border-radius:8px;
  font-family:inherit;
}
#bottombar button:hover{background:var(--hover)}
#bottombar button .ic{font-size:19px;line-height:1}
#bottombar button.on{color:var(--accent)}

/* ============ 目录抽屉 ============ */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
#mask.show{opacity:1;pointer-events:auto}
#drawer{
  position:fixed;top:0;bottom:0;left:0;width:min(300px,82vw);z-index:31;
  background:var(--panel-bg);transform:translateX(-105%);
  transition:transform .28s ease,background .3s;
  display:flex;flex-direction:column;
}
#drawer.show{transform:translateX(0)}
#drawer .head{padding:calc(16px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--border)}
#drawer .head .t{font-weight:700;font-size:17px}
#drawer .head .s{font-size:12px;color:var(--muted);margin-top:4px}
#drawer .list{flex:1;overflow-y:auto;padding:6px 0}
#drawer .item{
  padding:12px 18px;font-size:14.5px;cursor:pointer;color:var(--bar-text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
#drawer .item:hover{background:var(--hover)}
#drawer .item.cur{color:var(--accent);font-weight:600}

/* ============ 设置面板 ============ */
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:31;
  background:var(--panel-bg);border-radius:var(--radius) var(--radius) 0 0;
  padding:18px 20px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .28s ease,background .3s;
  max-height:76vh;overflow-y:auto;
}
#sheet.show{transform:translateY(0)}
#sheet .row{margin-bottom:18px}
#sheet .row:last-child{margin-bottom:0}
#sheet .label{font-size:12.5px;color:var(--muted);margin-bottom:9px}
#sheet .opts{display:flex;gap:10px}
#sheet .opt{
  flex:1;padding:9px 0;text-align:center;font-size:14px;cursor:pointer;
  border:1px solid var(--border);border-radius:8px;color:var(--bar-text);
  background:none;transition:all .15s;font-family:inherit;
}
#sheet .opt.on{border-color:var(--accent);color:var(--accent);font-weight:600}
#sheet .opt.font-sans-demo{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
#sheet .opt.font-serif-demo{font-family:"Noto Serif SC","Songti SC","SimSun",serif}
#sheet .stepper{display:flex;align-items:center;gap:14px}
#sheet .stepper button{
  width:44px;height:36px;border:1px solid var(--border);border-radius:8px;
  background:none;color:var(--bar-text);font-size:16px;cursor:pointer;font-family:inherit;
}
#sheet .stepper .val{flex:1;text-align:center;font-size:15px}
#sheet .swatch{width:40px;height:40px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex:none}
#sheet .swatch.on{border-color:var(--accent)}
.sw-light{background:#f7f2e8}.sw-eye{background:#d3e4cf}.sw-dark{background:#2a2a2a}

/* ============ 提示 ============ */
#toast{
  position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:50;
  background:rgba(0,0,0,.72);color:#fff;font-size:13.5px;
  padding:9px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .25s;
  white-space:nowrap;
}
#toast.show{opacity:1}
#loading{
  position:fixed;inset:0;display:grid;place-items:center;z-index:40;
  color:var(--muted);font-size:14px;pointer-events:none;
}
</style>
</head>
<body class="font-serif mode-paged">

<div id="stage">
  <!-- 翻页模式：双层页面 -->
  <div id="page-area">
    <div id="page-under" class="page content zoom"></div>
    <div id="page-over" class="page content"></div>
  </div>
  <!-- 分页测量容器 -->
  <div id="measurer" class="content"></div>
  <!-- 滚动模式 -->
  <div id="scroll-area">
    <div id="scroll-content" class="content"></div>
  </div>

  <div id="page-foot">
    <span id="foot-chap"></span>

  <!-- 点击/手势层 -->
  <div id="tap-layer">

<!-- 目录 -->
<aside id="drawer">

  </div>

<!-- 设置面板 -->
<div id="sheet">
  <div class="row">

      <button class="opt font-sans-demo" data-font="sans">黑体</button>

      <button class="opt" data-lh="1.6">紧凑</button>

    </div>

</div>

<div id="mask"></div>
<div id="toast"></div>
<div id="loading">加载中…</div>

<script>
/* ================================================================
 * 章节清单：新章节发布后，在数组末尾追加一行文件名即可
 * ============================================================== */
const BOOK = {
  series: '青空归处',   // 系列名（总书名）
  volume: '心火长明',   // 部名（第一部），之后出续部时改这里即可
  dir: '心火长明',
  chapters: [
    '0_落地过猛.md',
    '1_从捡到小狐娘开始.md',
    '2_不速之客.md',
    '3_休养.md',
    '4_再遇.md',
    '5_跟踪.md',
    '6_冒险家狐狐.md',
    '7_冒险家猫猫.md',
    '8_要更新了.md',
    '9_卸下伪装.md',
    '10_白虹城.md',
    '11_全副武装.md',
  ]
};

/* ================= 状态 ================= */
const LS_KEY = 'xinhuo-reader-v1';
const state = Object.assign({
  chapter: 0,      // 当前章节索引
  ratio: 0,        // 章节内进度 0~1
  mode: 'paged',   // paged | scroll
  theme: 'light',  // light | eye | dark
  font: 'serif',   // sans | serif
  fontSize: 18,
  lineHeight: 1.9,
}, loadState());

let pages = [];        // 当前章节的分页结果（HTML 字符串数组）
let curPage = 0;
let animating = false; // 翻页动画进行中
let blocksCache = {};  // 章节解析缓存
let pageCache = {};    // 分页结果缓存：layoutKey -> pages

function loadState(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; } }
function saveState(){
  state.ratio = currentRatio();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function chapterTitle(file){
  return file.replace(/\.md$/,'').replace(/^\d+_/,'');
}
let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ================= 章节加载与解析 ================= */
async function loadBlocks(idx){
  if(blocksCache[idx]) return blocksCache[idx];
  const file = BOOK.chapters[idx];
  const url = encodeURIComponent(BOOK.dir) + '/' + encodeURIComponent(file);
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  let text = await res.text();
  // 去除修订批注（HTML 注释）
  text = text.replace(/<!--[\s\S]*?-->/g, '');
  const blocks = [];
  for(const raw of text.split(/\n{2,}|\r\n{2,}/)){
    const block = raw.trim();
    if(!block) continue;
    if(block.startsWith('# '))       blocks.push({t:'h1', x:block.slice(2).trim()});
    else if(block.startsWith('## ')) blocks.push({t:'h2', x:block.slice(3).trim()});
    else {
      for(const line of block.split(/\r?\n/)){
        const l = line.trim();
        if(l) blocks.push({t:'p', x:l});
      }
    }
  }
  blocksCache[idx] = blocks;
  return blocks;
}

function renderBlocks(blocks){
  return blocks.map(b=>{
    if(b.t==='h1') return '<h1>'+escapeHtml(b.x)+'</h1>';
    if(b.t==='h2') return '<h2>'+escapeHtml(b.x)+'</h2>';
    return '<p>'+escapeHtml(b.x)+'</p>';
  }).join('');
}
function blockHtml(b){
  if(b.t==='h1') return '<h1>'+escapeHtml(b.x)+'</h1>';
  if(b.t==='h2') return '<h2>'+escapeHtml(b.x)+'</h2>';
  return '<p>'+escapeHtml(b.x)+'</p>';
}

/* ================= 手动分页 =================
 * 逐块放入不可见的测量容器，高度超出页面高度即换页。
 * 每页是独立的真实 DOM，杜绝多列分页的边缘漏字问题。
 * ============================================================== */
function layoutKey(idx){
  return [idx, state.font, state.fontSize, state.lineHeight,
          $('#page-over').clientWidth, $('#page-over').clientHeight].join('|');
}

function paginate(idx, blocks){
  const key = layoutKey(idx);
  if(pageCache[key]) return pageCache[key];

  const meas = $('#measurer');
  const H = $('#page-over').clientHeight;
  meas.style.width = $('#page-over').clientWidth + 'px';
  meas.style.fontSize = state.fontSize + 'px';
  meas.style.lineHeight = state.lineHeight;
  meas.style.fontFamily = getComputedStyle($('#page-over')).fontFamily;
  meas.innerHTML = '';

  const holder = document.createElement('div');
  holder.style.display = 'flow-root'; // 防止子元素 margin 坍缩影响测量
  meas.appendChild(holder);

  const result = [];
  let curHtml = [];
  for(const b of blocks){
    const node = document.createElement(b.t);
    node.textContent = b.x;
    holder.appendChild(node);
    if(holder.offsetHeight > H && holder.children.length > 1){
      // 超出：该块移到下一页
      holder.removeChild(node);
      result.push(curHtml.join(''));
      holder.innerHTML = '';
      holder.appendChild(node);
      curHtml = [blockHtml(b)];
    }else{
      curHtml.push(blockHtml(b));
    }
  }
  if(curHtml.length) result.push(curHtml.join(''));
  if(!result.length) result.push('');

  meas.innerHTML = '';
  // 缓存控制：最多保留 20 组分页结果
  const keys = Object.keys(pageCache);
  if(keys.length > 20) delete pageCache[keys[0]];
  pageCache[key] = result;
  return result;
}

/* ================= 翻页动画 =================
 * 上一页滑走；下一页缩小 + 模糊垫在底下，
 * 上一页完全离开后再放大回原值并变清晰。
 * ============================================================== */
function slideTurn(targetHtml, dir){
  return new Promise(resolve=>{
    const over = $('#page-over'), under = $('#page-under');
    animating = true;

    under.innerHTML = targetHtml;
    under.style.transition = 'none';
    under.classList.add('zoom');
    over.style.transition = 'none';
    over.style.transform = 'translateX(0)';
    over.classList.add(dir > 0 ? 'sliding-next' : 'sliding-prev');
    void over.offsetHeight; // 强制重排，确保初始状态生效

    // 第一阶段：当前页滑出屏幕
    over.style.transition = 'transform .32s cubic-bezier(.25,.6,.3,1)';
    over.style.transform = 'translateX(' + (dir > 0 ? '-103%' : '103%') + ')';

    const onOver = e=>{
      if(e.propertyName !== 'transform') return;
      over.removeEventListener('transitionend', onOver);
      // 第二阶段：底层页面放大回 1 并恢复清晰
      under.style.transition = 'transform .26s ease, filter .26s ease, opacity .26s ease';
      under.classList.remove('zoom');

      const onUnder = e=>{
        if(e.propertyName !== 'transform') return;
        under.removeEventListener('transitionend', onUnder);
        // 归位：顶层变为当前页，底层清空待命
        over.style.transition = 'none';
        over.style.transform = 'translateX(0)';
        over.classList.remove('sliding-next','sliding-prev');
        over.innerHTML = targetHtml;
        under.style.transition = 'none';
        under.innerHTML = '';
        under.classList.add('zoom');
        animating = false;
        resolve();
      };
      under.addEventListener('transitionend', onUnder);
    };
    over.addEventListener('transitionend', onOver);
  });
}

/* ================= 章节显示与翻页 ================= */
function pageFromRatio(r){
  return Math.max(0, Math.min(pages.length-1, Math.round((r||0) * Math.max(0, pages.length-1))));
}
function currentRatio(){
  if(state.mode === 'paged'){
    return pages.length > 1 ? curPage / (pages.length-1) : 0;
  }
  const area = $('#scroll-area');
  const max = area.scrollHeight - area.clientHeight;
  return max > 0 ? area.scrollTop / max : 0;
}

function updateChrome(){
  const title = chapterTitle(BOOK.chapters[state.chapter]);
  $('#topbar-chap').textContent = title;
  $('#foot-chap').textContent = title;
  $('#foot-page').textContent = (curPage+1) + ' / ' + Math.max(1, pages.length);
  document.title = title + ' · ' + BOOK.series + '：' + BOOK.volume;
  markCatalogCurrent();
}

async function showChapter(idx, ratio){
  idx = Math.max(0, Math.min(BOOK.chapters.length-1, idx));
  state.chapter = idx;
  $('#loading').style.display = 'grid';
  try{
    const blocks = await loadBlocks(idx);
    $('#scroll-content').innerHTML = renderBlocks(blocks);
    if(state.mode === 'paged'){
      pages = paginate(idx, blocks);
      curPage = pageFromRatio(ratio);
      $('#page-over').innerHTML = pages[curPage] || '';
      $('#page-under').innerHTML = '';
      $('#scroll-area').scrollTop = 0;
    }else{
      pages = [];
      curPage = 0;
      requestAnimationFrame(()=>{
        const area = $('#scroll-area');
        const max = area.scrollHeight - area.clientHeight;
        area.scrollTop = max > 0 ? (ratio||0) * max : 0;
      });
    }
    updateChrome();
    $('#loading').style.display = 'none';
    saveState();
  }catch(e){
    $('#loading').textContent = '章节加载失败：' + e.message;
  }
}

/* 带动画翻到指定章节指定页 */
async function turnTo(chap, page, dir){
  if(animating) return;
  animating = true;
  try{
    let targetPages;
    if(chap === state.chapter){
      targetPages = pages;
    }else{
      const blocks = await loadBlocks(chap);
      targetPages = paginate(chap, blocks);
      $('#scroll-content').innerHTML = renderBlocks(blocks);
    }
    page = Math.max(0, Math.min(targetPages.length-1, page));
    const html = targetPages[page] || '';
    animating = false; // slideTurn 内部自行管理
    await slideTurn(html, dir);
    state.chapter = chap;
    pages = targetPages;
    curPage = page;
    updateChrome();
    saveState();
  }catch(e){
    animating = false;
    toast('加载失败：' + e.message);
  }
}

function nextPage(){
  if(animating) return;
  if(curPage < pages.length-1) turnTo(state.chapter, curPage+1, 1);
  else if(state.chapter < BOOK.chapters.length-1) turnTo(state.chapter+1, 0, 1);
  else toast('已经是最后一章了');
}
function prevPage(){
  if(animating) return;
  if(curPage > 0) turnTo(state.chapter, curPage-1, -1);
  else if(state.chapter > 0){
    // 上一章末页：页数要先分页才知道，用极大值交由 turnTo 收敛
    turnTo(state.chapter-1, 1e9, -1);
  } else toast('已经是第一章了');
}

/* 字号/行距/字体/尺寸变化后重新分页，保持阅读位置 */
async function relayout(){
  if(state.mode !== 'paged') return;
  const r = currentRatio();
  try{
    const blocks = await loadBlocks(state.chapter);
    pages = paginate(state.chapter, blocks);
    curPage = pageFromRatio(r);
    $('#page-over').innerHTML = pages[curPage] || '';
    $('#foot-page').textContent = (curPage+1) + ' / ' + Math.max(1, pages.length);
    saveState();
  }catch(e){/* 忽略 */}
}

/* ================= 界面开关 ================= */
let uiVisible = false;
function showUI(){
  uiVisible = true;
  $('#topbar').classList.remove('hidden');
  $('#bottombar').classList.remove('hidden');
}
function hideUI(){
  uiVisible = false;
  $('#topbar').classList.add('hidden');
  $('#bottombar').classList.add('hidden');
  closePanels();
}
function toggleUI(){ uiVisible ? hideUI() : showUI(); }
function closePanels(){
  $('#drawer').classList.remove('show');
  $('#sheet').classList.remove('show');
  $('#mask').classList.remove('show');
}
function openDrawer(){
  $('#sheet').classList.remove('show');
  $('#drawer').classList.add('show');
  $('#mask').classList.add('show');
  const cur = $('#catalog .item.cur');
  if(cur) cur.scrollIntoView({block:'center'});
}
function openSheet(){
  $('#drawer').classList.remove('show');
  $('#sheet').classList.add('show');
  $('#mask').classList.add('show');
}

/* ================= 设置应用 ================= */
function applySettings(){
  document.documentElement.dataset.theme = state.theme;
  document.body.classList.toggle('mode-scroll', state.mode === 'scroll');
  document.body.classList.toggle('mode-paged', state.mode === 'paged');
  document.body.classList.toggle('font-sans', state.font === 'sans');
  document.body.classList.toggle('font-serif', state.font === 'serif');
  for(const el of document.querySelectorAll('.content')){
    el.style.fontSize = state.fontSize + 'px';
    el.style.lineHeight = state.lineHeight;
  }
  $('#mode-label').textContent = state.mode === 'paged' ? '滚动' : '翻页';
  const themeMap = {light:'夜间', eye:'白天', dark:'护眼'};
  const iconMap = {light:'☾', eye:'☀', dark:'☘'};
  $('#theme-label').textContent = themeMap[state.theme];
  $('#btn-theme .ic').textContent = iconMap[state.theme];
  $('#fs-val').textContent = state.fontSize;
  document.querySelectorAll('#sheet [data-font]').forEach(b=>b.classList.toggle('on', b.dataset.font === state.font));
  document.querySelectorAll('#sheet [data-lh]').forEach(b=>b.classList.toggle('on', Math.abs(parseFloat(b.dataset.lh) - state.lineHeight) < 0.01));
  document.querySelectorAll('#sheet [data-theme-opt]').forEach(b=>b.classList.toggle('on', b.dataset.themeOpt === state.theme));
  document.querySelectorAll('#sheet [data-mode]').forEach(b=>b.classList.toggle('on', b.dataset.mode === state.mode));
}

function switchMode(mode){
  if(mode === state.mode) return;
  const r = currentRatio();
  state.mode = mode;
  applySettings();
  showChapter(state.chapter, r);
}

/* ================= 目录 ================= */
function buildCatalog(){
  $('#topbar .book').textContent = BOOK.series + '：' + BOOK.volume;
  $('#drawer .head .t').textContent = BOOK.volume;   // 目录标题 = 部名
  $('#drawer-sub').textContent = BOOK.series + ' · 共 ' + BOOK.chapters.length + ' 章';
  const box = $('#catalog');
  box.innerHTML = '';
  BOOK.chapters.forEach((file, i)=>{
    const div = document.createElement('div');
    div.className = 'item';
    div.textContent = chapterTitle(file);
    div.addEventListener('click', ()=>{
      closePanels(); hideUI();
      showChapter(i, 0);
    });
    box.appendChild(div);
  });
}
function markCatalogCurrent(){
  document.querySelectorAll('#catalog .item').forEach((el,i)=>{
    el.classList.toggle('cur', i === state.chapter);
  });
}

/* ================= 事件绑定 ================= */
$('#zone-prev').addEventListener('click', ()=>{ if(!uiVisible) prevPage(); });
$('#zone-next').addEventListener('click', ()=>{ if(!uiVisible) nextPage(); });
$('#zone-mid').addEventListener('click', toggleUI);

// 滑动手势（翻页模式）
let touchX = 0, touchY = 0;
$('#stage').addEventListener('touchstart', e=>{
  touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
}, {passive:true});
$('#stage').addEventListener('touchend', e=>{
  if(state.mode !== 'paged' || uiVisible) return;
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if(Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4){
    dx < 0 ? nextPage() : prevPage();
  }
}, {passive:true});

// 键盘
document.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight' || e.key === 'PageDown'){ state.mode==='paged' ? nextPage() : $('#scroll-area').scrollBy({top:innerHeight*0.9,behavior:'smooth'}); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ state.mode==='paged' ? prevPage() : $('#scroll-area').scrollBy({top:-innerHeight*0.9,behavior:'smooth'}); }
  else if(e.key === 'Escape'){ closePanels(); hideUI(); }
});

// 底栏
$('#btn-catalog').addEventListener('click', openDrawer);
$('#btn-settings').addEventListener('click', openSheet);
$('#btn-back').addEventListener('click', hideUI);
$('#btn-mode').addEventListener('click', ()=>{
  switchMode(state.mode === 'paged' ? 'scroll' : 'paged');
});
$('#btn-theme').addEventListener('click', ()=>{
  state.theme = state.theme === 'light' ? 'dark' : (state.theme === 'dark' ? 'eye' : 'light');
  applySettings(); saveState();
});

// 遮罩
$('#mask').addEventListener('click', closePanels);

// 设置面板
document.querySelectorAll('#sheet [data-font]').forEach(b=>b.addEventListener('click', ()=>{
  state.font = b.dataset.font; applySettings(); relayout(); saveState();
}));
document.querySelectorAll('#sheet [data-lh]').forEach(b=>b.addEventListener('click', ()=>{
  state.lineHeight = parseFloat(b.dataset.lh); applySettings(); relayout(); saveState();
}));
document.querySelectorAll('#sheet [data-theme-opt]').forEach(b=>b.addEventListener('click', ()=>{
  state.theme = b.dataset.themeOpt; applySettings(); saveState();
}));
document.querySelectorAll('#sheet [data-mode]').forEach(b=>b.addEventListener('click', ()=>{
  switchMode(b.dataset.mode);
}));
$('#fs-minus').addEventListener('click', ()=>{
  state.fontSize = Math.max(14, state.fontSize - 1);
  applySettings(); relayout(); saveState();
});
$('#fs-plus').addEventListener('click', ()=>{
  state.fontSize = Math.min(28, state.fontSize + 1);
  applySettings(); relayout(); saveState();
});

// 滚动模式：记录进度
let scrollSaveTimer = null;
$('#scroll-area').addEventListener('scroll', ()=>{
  clearTimeout(scrollSaveTimer);
  scrollSaveTimer = setTimeout(saveState, 400);
}, {passive:true});

// 窗口尺寸变化
let resizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(relayout, 150);
});
window.addEventListener('beforeunload', saveState);

// 网络字体加载完成后字宽会变，重新分页一次
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>relayout());
}

/* ================= 启动 ================= */
if(location.protocol === 'file:'){
  $('#loading').textContent = '请通过本地服务器或 GitHub Pages 访问（file:// 协议无法加载章节）';
}else{
  buildCatalog();
  applySettings();
  showChapter(state.chapter, state.ratio);
}
</script>
</body>
</html>
